name = "pansou-cf"
main = "src/index.ts"
compatibility_date = "2026-09-06"

# KV 缓存：部署前需自建并替换 id（Dashboard 创建 KV，或 `npx wrangler kv namespace create CACHE`）
# 不需要缓存可整段删除，程序自动降级为直连搜索
[[kv_namespaces]]
binding = "CACHE"
id = "b53422454d744d0c8af9d10ec92e06b5"

[vars]
ENV = "production"
VERSION = "v0.08"

# 静态前端（pansou-web 构建产物，见 scripts/build-web.sh）
[assets]
directory = "./dist-web"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[observability]
enabled = true